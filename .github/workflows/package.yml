name: Build DMG and unsigned IPA

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Optional app version (for example 1.2.3); blank uses the project version"
        required: false
        type: string
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

concurrency:
  group: packages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Package ${{ matrix.package }}
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        package: [dmg, ipa]
    outputs:
      source_commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record source and toolchain
        id: source
        run: |
          printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          xcodebuild -version
          xcodebuild -showsdks

      - name: Run macOS unit tests
        if: matrix.package == 'dmg'
        run: |
          mkdir -p .build/artifacts.noindex/package/logs
          if ! python3 Scripts/build_isolation.py exec --lane mac-tests -- \
            xcodebuild -project WordAtlas.xcodeproj -scheme WordAtlas-macOS \
            -configuration Debug -destination 'platform=macOS' \
            -derivedDataPath .build/artifacts.noindex/package/test-derived-data \
            -resultBundlePath .build/artifacts.noindex/package/test-results.xcresult \
            test > .build/artifacts.noindex/package/logs/macos-tests.log 2>&1; then
            tail -n 80 .build/artifacts.noindex/package/logs/macos-tests.log
            exit 1
          fi

      - name: Build package
        env:
          PACKAGE_KIND: ${{ matrix.package }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          version="$REQUESTED_VERSION"
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          args=("$PACKAGE_KIND" --build-number "$GITHUB_RUN_NUMBER")
          if [[ -n "$version" ]]; then
            args+=(--version "$version")
          fi
          bash Scripts/package.sh "${args[@]}"

      - name: Upload package and checksum
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Lexisle-package-${{ matrix.package }}
          path: |
            dist/*.${{ matrix.package }}
            dist/*.${{ matrix.package }}.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: true

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Lexisle-build-logs-${{ matrix.package }}
          path: |
            .build/artifacts.noindex/package/logs/
            .build/artifacts.noindex/package/test-results.xcresult/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
          overwrite: true

      - name: Add download link to run summary
        env:
          PACKAGE_KIND: ${{ matrix.package }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          printf '### %s package\n\n[Download package and SHA-256 checksum](%s)\n' \
            "$PACKAGE_KIND" "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish tagged release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download both packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: Lexisle-package-*
          merge-multiple: true
          path: dist

      - name: Verify and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          EXPECTED_COMMIT: ${{ needs.build.outputs.source_commit }}
        run: |
          # Do not publish stale binaries if a tag moved while the build was running.
          actual_commit=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq '.sha')
          if [[ "$actual_commit" != "$EXPECTED_COMMIT" ]]; then
            echo '::error::The release tag no longer points to the commit used for these packages.'
            exit 1
          fi

          shopt -s nullglob
          dmgs=(dist/*-macOS-universal.dmg)
          ipas=(dist/*-iOS-unsigned.ipa)
          checksums=(dist/*.sha256)
          if [[ ${#dmgs[@]} -ne 1 || ${#ipas[@]} -ne 1 || ${#checksums[@]} -ne 2 ]]; then
            echo '::error::Expected one DMG, one unsigned IPA, and their two checksums.'
            exit 1
          fi
          (cd dist && sha256sum --check --strict -- *.sha256)
          assets=("${dmgs[@]}" "${ipas[@]}" "${checksums[@]}")

          if gh release view "$RELEASE_TAG" --json tagName --jq '.tagName' >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag \
              --title "词屿 · Lexisle $RELEASE_TAG" --generate-notes
          fi
